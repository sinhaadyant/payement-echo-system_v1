services:
  - type: web
    name: payment-echo-system
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true  # Automatically deploy on git push
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: production
      # Note: DATABASE_URL will be automatically added when you link the PostgreSQL database
      # Create the database manually in Render dashboard, then link it to this service
    healthCheckPath: /actuator/health

