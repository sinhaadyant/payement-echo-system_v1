services:
  - type: web
    name: payment-echo-system
    runtime: java
    plan: free
    buildCommand: ./gradlew clean build -x test
    startCommand: java -jar build/libs/payment-echo-system-0.0.1-SNAPSHOT.jar
    autoDeploy: true  # Automatically deploy on git push
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: production
      # Note: DATABASE_URL will be automatically added when you link the PostgreSQL database
      # Create the database manually in Render dashboard, then link it to this service
    healthCheckPath: /actuator/health

