# Production Configuration for Render
# This file is used when SPRING_PROFILES_ACTIVE=production

# Server Configuration - PORT from environment variable
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Render PostgreSQL)
# Render provides DATABASE_URL in format: postgresql://user:password@host:port/database
# Spring Boot can parse this automatically, but we'll use it directly
spring.datasource.url=${DATABASE_URL}
# If DATABASE_URL is not in JDBC format, Spring Boot will convert it automatically
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Configuration (optimized for free tier)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.health.db.enabled=true

# Application info
info.app.name=Payment Echo System
info.app.description=Payment management system with creditor and debtor support
info.app.version=1.0.0

# Logging configuration (less verbose in production)
logging.level.com.example.paymentecho=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# OpenAPI/Swagger (can disable in production if needed)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# GraphQL
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false

# Disable DevTools in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Sample Data Initialization - Disabled in production
app.data.initialize=false

# Locale Configuration - Default to Hindi
spring.web.locale=hi

