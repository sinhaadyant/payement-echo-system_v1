# GitHub Actions workflow for Render deployment
# Note: Render handles deployment automatically via webhooks
# This workflow is optional and can be used for additional checks

name: Render Deployment Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      
      - name: Build application
        run: ./gradlew clean build -x test
      
      - name: Verify JAR exists
        run: |
          if [ ! -f "build/libs/payment-echo-system-0.0.1-SNAPSHOT.jar" ]; then
            echo "❌ JAR file not found!"
            exit 1
          fi
          echo "✅ JAR file created successfully"
          ls -lh build/libs/*.jar
      
      - name: Check JAR size
        run: |
          SIZE=$(stat -f%z build/libs/payment-echo-system-0.0.1-SNAPSHOT.jar 2>/dev/null || stat -c%s build/libs/payment-echo-system-0.0.1-SNAPSHOT.jar)
          echo "JAR size: $SIZE bytes"
          if [ $SIZE -lt 1000000 ]; then
            echo "⚠️ Warning: JAR file seems too small"
          fi

